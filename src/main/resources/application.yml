spring:
  application:
    name: power-data-pipeline

  datasource:
    url: jdbc:h2:file:./data/powerdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

# Pipeline Configuration
pipeline:
  data:
    raw-path: data/raw

  sources:
    priority:
      - POSOCO
      - STATE_LOAD_DISPATCH

  quality:
    max-allowed-null-percentage: 10.0
    enable-duplicate-check: true

logging:
  level:
    com.power.pipeline: INFO
    org.springframework: WARN

# AWS Bedrock Configuration (Optional - for LLM mode)
# Keys are read from environment variables (NOT stored here)
aws:
  bedrock:
    region: ${AWS_REGION:us-east-1}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    model-id: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    enabled: ${AWS_BEDROCK_ENABLED:false}
